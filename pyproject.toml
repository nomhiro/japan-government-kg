[project]
name = "jgkg"
version = "0.1.0"
description = "Japan Government Knowledge Graph - data layer"
requires-python = ">=3.12"
dependencies = [
    "linkml==1.11.1",
    "rdflib>=7.1",
    "pyshacl>=0.29",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # D-3: API層(仕様§9.1)。LinkMLのような単一ソースではないため範囲指定
    # (data/artifact/・data/lake/のようなデータに影響しない道具は厳密固定しない)
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
# pyyaml は linkml 経由で入るが、tests/test_workflows.py が直接使うので
# 推移依存に頼らず宣言する(裁定B83)
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jgkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: 実ネットワークへの接続を許可する(既定は tests/conftest.py が禁止する)。仕様§10により、2026-08-25時点で使用例は無いはず。",
]

[tool.ruff]
line-length = 100
target-version = "py312"
