name: Cold read measurement (manual)

# **裁定B55・B61・B62が3回繰り越した数字を出すためのワークフロー(裁定B71)。**
#
# なぜ開発機で測れないか: 真のコールドキャッシュが必要で、開発機では
# `wsl --shutdown` かVM内の `drop_caches` を要し、他の並行ジョブを巻き込む。
# `docker restart` では足りない(VMのページキャッシュが残る)。
#
# **GitHub Actions のランナーは真にコールドである**: 毎回新しい仮想マシンで、
# ダウンロードしたばかりのファイルに対してページキャッシュが空であり、
# **実Linuxファイルシステム(ext4。Windowsのバインドマウントではない)**である。
#
# **`workflow_dispatch` のみ。** ci.yml に足すと毎pushで44MBのダウンロードと
# Fuseki起動が乗る——この測定は「配備の判断をする前に1回」でよい。
#
# **配信は `docker compose`(リポジトリ自身の構成)で行う。**
#
# 初稿は「イメージのビルド時間を払わない」「経路を短くして『何を測っているか』を
# 曖昧にしない」という理由で `fuseki-server --loc=` を直接叩いていた。
# **その判断が測定を空虚にした** —— `fuseki/kg.ttl` の
# `tdb2:unionDefaultGraph true` を回避してしまい、データが全て名前付きグラフに
# あるのに既定グラフが空になり、「ラベル領域 0.036秒 / 支出領域 0行」という
# **もっともらしいが何も測っていない表**が出た(2026-08-30の実行)。
#
# **経路を短くすると「何を測っているか」が変わる。** 配信構成は配備先と
# 同じものを使う。Linux では compose のバインドマウントは実質ネイティブFSなので、
# 測定の趣旨(Windowsのバインドマウントでない実Linux FS)も損なわない。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "測定対象のリリースタグ(空なら最新)"
        required: false
        default: ""
      repeats:
        description: "各段の測定回数(裁定B55: 1回で結論しない)"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Resolve the pinned Jena version
        id: jena
        run: |
          # **.env.example から導出する(直書きしない)。** 設計書§6.3が
          # 「Jenaのバージョンをmanifestに記録し実行側で照合する」を要求しており、
          # このワークフローがそこからずれた版で測ると測定自体が別物になる
          version="$(grep -E '^JENA_VERSION=' .env.example | cut -d= -f2)"
          test -n "$version" || { echo "::error::.env.example に JENA_VERSION が無い"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Jena $version を使う"

      - name: Download the published KG artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p work/release
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern 'tdb2.tar.gz' --pattern 'manifest.json' --dir work/release
          else
            gh release download --pattern 'tdb2.tar.gz' --pattern 'manifest.json' --dir work/release
          fi
          ls -la work/release

      - name: Verify and stage the artifact with the repo's own gate
        env:
          JENA_VERSION: ${{ steps.jena.outputs.version }}
        run: |
          # **照合を手で書き直さない。** `jgkg.serve`(`stage_release`)が
          # 「展開より先に sha256 と Jenaバージョンを照合する」唯一の場所であり
          # (設計書§6.3・レビューI3)、そこを通らない経路を作ると
          # 「照合しない記録は記録の演技」に戻る。既定の配置先
          # (data/artifact/current/tdb2)はこのチェックアウト内=ランナーの
          # ネイティブFS上にある。
          uv run python -m jgkg.serve work/release
          du -sh data/artifact/current/tdb2

      - name: Start Fuseki with the repo's own compose configuration
        env:
          JENA_VERSION: ${{ steps.jena.outputs.version }}
        run: |
          # **リポジトリ自身の配信構成を使う(docker compose)。**
          #
          # 初回の「成功」実行では `fuseki-server --loc=` を直接叩いていた ——
          # 経路を短くしたつもりが、**`fuseki/kg.ttl` の
          # `tdb2:unionDefaultGraph true` を回避してしまい**、データが全て
          # 名前付きグラフにあるのに既定グラフが空になった。
          # 結果は「ラベル領域 0.036秒 / 支出領域 0行」という
          # **もっともらしいが何も測っていない表**だった。
          #
          # **経路を短くすると「何を測っているか」が変わる。**
          # 配信構成は配備先と同じものを使う。Linux では compose の
          # バインドマウントは実質ネイティブFSなので、測定の趣旨
          # (バインドマウントでない実Linux FS)も損なわない。
          docker compose up -d --build fuseki
          docker compose ps

      - name: Measure the cold read
        env:
          REPEATS: ${{ inputs.repeats }}
        run: |
          # **--manifest を渡す。** 渡さないとデータセットの同一性を検査せず
          # 警告だけになる(観察O16)。**ただし同一性検査だけでは足りない**
          # —— 測定スクリプト側が「0件を測ったら止める」ことも併せて効かせる
          uv run python scripts/measure-cold-read.py --manifest work/release/manifest.json --repeats "${REPEATS:-3}"

      - name: Show the Fuseki log if something failed
        if: failure()
        run: docker compose logs --tail=80 fuseki || true
