name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      # D-5: フロントエンド(Vite+TypeScript+Sigma.js)。build-site.sh の
      # `npm run build` と、下の型/表示名の再生成ステップが必要とする。
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test the frontend (裁定B82(3): 表示の正直さの純粋関数を縛る)
        # `describePathResult`(found=falseの読み方。裁定B77の族)・
        # `computeApiUnavailableReason`(裁定B82(2))・表示名フォールバック等、
        # DOM非依存の純粋関数だけを対象にする(jsdom等は導入していない——
        # 「画面が実際にどう見えるか」はD-5の実データ+実ブラウザでの手動確認で
        # 担保する、という判断を維持する)。
        run: npm test
        working-directory: frontend

      - name: Regenerate schema and fail if it differs from the committed output
        run: |
          ./scripts/generate-schema.sh
          # `git diff` は未追跡ファイルを見ないので、新モジュールを足したときに
          # 生成物が未追跡のまま生えても緑になる。--porcelain で未追跡も見る
          if [ -n "$(git status --porcelain schema/generated/)" ]; then
            git status --porcelain schema/generated/
            git diff -- schema/generated/ || true
            echo "::error::生成物がコミットされたものと異なる(未追跡ファイルを含む)。scripts/generate-schema.sh を実行してコミットする"
            exit 1
          fi

      - name: Regenerate frontend types/labels and fail if they differ from the committed output
        run: |
          # D-5ブリーフ設計2・裁定B78: APIの型・オントロジーの表示名は
          # 手書きしない。上のschema regen-diffと同じ形で、
          # frontend/openapi.json・frontend/src/api/openapi-types.ts・
          # frontend/src/generated/labels.json が実際の導出元(app.openapi()・
          # schema/generated/all.owl.ttl)と一致していることを確認する
          # ——一致しないコミットは「オントロジー/APIを変えたのに
          # フロントエンドの生成物を再生成し忘れた」ことを意味する。
          bash scripts/generate-frontend-types.sh
          if [ -n "$(git status --porcelain frontend/openapi.json frontend/src/api/openapi-types.ts frontend/src/generated/labels.json)" ]; then
            git status --porcelain frontend/openapi.json frontend/src/api/openapi-types.ts frontend/src/generated/labels.json
            git diff -- frontend/openapi.json frontend/src/api/openapi-types.ts frontend/src/generated/labels.json || true
            echo "::error::フロントエンドの生成物がコミットされたものと異なる。scripts/generate-frontend-types.sh を実行してコミットする"
            exit 1
          fi

      - name: Assert the base URI is consistent everywhere it is baked in
        run: |
          # 旧版はドメイン文字列を src/**.py から grep するだけで、実際に
          # ドメインが焼き込まれている schema/*.yaml・schema/overlay/*.ttl・
          # queries/cq/*.rq・schema/generated/** を一切見ていなかった。
          # 検査を本物にする(設計書§4.2 / レビューC1)
          uv run python -m jgkg.base_uri --check

      - name: Check the frontend build is byte-for-byte reproducible (裁定B81)
        # `npm run build`(2回)は型検査(tsc --noEmit)も含むので、
        # この1ステップで型検査とビルド再現性の両方を確認する
        # ——別に`npm run typecheck`のステップを置くと同じtscを
        # 何度も走らせるだけになる。
        run: uv run python scripts/check-frontend-build.py

      - name: Build the static site (schema/generated/ + frontend/ -> site/)
        run: bash scripts/build-site.sh

      - name: Check the site build's content (no server needed; A-2)
        run: |
          # verify-site.py(別ワークフロー・毎日1回)はHTTP越しに配信済みの
          # サイトを検査する。ここはビルド成果物をファイルシステムから直接
          # 検査するだけで、コミット毎に決定的に回せる(このセッションで
          # 実際に踏んだ欠陥――law/budgetモジュールがビルド成果物に無かった・
          # sitemapが9件で期待15件――はどちらもこれで捕まえられる)。
          uv run python scripts/check-site-build.py

      - name: Assert building the site left the working tree clean
        run: |
          # site/def/・site/sitemap.txt・site/_headers・site/index.html・
          # site/assets/ は.gitignore対象だが、ビルドがそれ以外の追跡ファイルを
          # 変えていないことを確認する(schema/generated/・frontend/の生成物の
          # 差分は上のステップで既に確認済みだが、ここは「site構築の副作用」
          # という別の観点の確認)。
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::site/ のビルドが追跡ファイルを変えた。想定外の副作用がある"
            exit 1
          fi

      - name: Test
        run: uv run pytest tests/ -v

  # ---------------------------------------------------------------------------
  # 継続的デリバリ: main に入ったらサイトを自動で配信する
  #
  # **なぜサイトはCIで配信できるのか**: `site/def/` はコミット済みの
  # `schema/generated/*.ttl` から完全に導出できる。だからCIが手元と同じものを
  # 作れる。**データ成果物(`data/artifact/`)はこれができない** —
  # `.gitignore` 対象で、作り直すにはレイク(政府データそのもの)が必要だから。
  # 配布は `scripts/publish-release.sh` でローカルから行う(B-1)。
  #
  # **配信後に本番を検査する**のがこのジョブの要点である。このセッションで
  # 2つの失敗を踏んだ:
  #   1. 公開物が2日間陳腐化(law/budgetがHTTP 200のままHTMLを返し続けた)
  #   2. `wrangler pages deploy` がブランチ名を推論してプレビューに配信し、
  #      `16 files uploaded` と成功を出したのに本番は2日前のままだった
  # 配信直後に verify-site.py を回せば、**どちらも即座に赤くなる**。
  # ---------------------------------------------------------------------------
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 連続pushでデプロイが競合しないよう直列化する(後勝ちで良い)
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build the static site
        run: bash scripts/build-site.sh

      - name: Check the site build before shipping it
        # test ジョブでも同じ検査をしているが、**配信するその成果物**を
        # 配信直前に検査する。ビルドは決定的なので同じ結果になるはずで、
        # ならなければそれ自体が発見である。
        run: uv run python scripts/check-site-build.py

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN が未設定なのでデプロイを飛ばす。リポジトリの Settings > Secrets and variables > Actions に CLOUDFLARE_API_TOKEN(スコープ: Account > Cloudflare Pages > Edit)と CLOUDFLARE_ACCOUNT_ID を設定すること。設定するまで本番は更新されない(site-check.yml が翌日に検出する)"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # **--branch main は必須。** 省略すると wrangler が現在のブランチ名を
          # 使い、本番ではなくそのブランチのプレビュー配信になる(独自ドメインは
          # 更新されない)。2026-08-25に実際に踏んだ。
          # wrangler はメジャー固定にする(配信ツールでデータに影響しないため、
          # linkml や Jena のような厳密固定はしない)。
          npx --yes wrangler@4 pages deploy site --project-name jgkg --branch main

      - name: Verify production after deploying
        if: steps.deploy.outputs.skipped != 'true'
        run: |
          # Cloudflare Pages の反映は速いが即時ではない。有限回試して、
          # 最後まで通らなければ**落とす**(通るまで待ち続けたり、
          # 通らないのに緑にしたりしない)。
          for attempt in 1 2 3 4 5 6; do
            if uv run python scripts/verify-site.py https://jgkg.norr-tech.com; then
              echo "本番の検査に合格した(${attempt}回目)"
              exit 0
            fi
            echo "検査が通らない。10秒待って再試行する(${attempt}/6)"
            sleep 10
          done
          echo "::error::配信は成功したが、本番の検査が通らない。配信先が本番でない(プレビューに入った)可能性がある"
          exit 1
