name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Regenerate schema and fail if it differs from the committed output
        run: |
          ./scripts/generate-schema.sh
          # `git diff` は未追跡ファイルを見ないので、新モジュールを足したときに
          # 生成物が未追跡のまま生えても緑になる。--porcelain で未追跡も見る
          if [ -n "$(git status --porcelain schema/generated/)" ]; then
            git status --porcelain schema/generated/
            git diff -- schema/generated/ || true
            echo "::error::生成物がコミットされたものと異なる(未追跡ファイルを含む)。scripts/generate-schema.sh を実行してコミットする"
            exit 1
          fi

      - name: Assert the base URI is consistent everywhere it is baked in
        run: |
          # 旧版はドメイン文字列を src/**.py から grep するだけで、実際に
          # ドメインが焼き込まれている schema/*.yaml・schema/overlay/*.ttl・
          # queries/cq/*.rq・schema/generated/** を一切見ていなかった。
          # 検査を本物にする(設計書§4.2 / レビューC1)
          uv run python -m jgkg.base_uri --check

      - name: Test
        run: uv run pytest tests/ -v
