id: https://jgkg.norr-tech.com/def/law
name: jgkg-law
title: 日本政府ナレッジグラフ 法令モジュール
description: >-
  法令(Law)と、その改正イベント(LawRevision)を表すクラスとプロパティ。正準IDは
  法令ID(e-Gov法令API が付与する)であり、法令番号や題名は改正で変わり得るため
  同一性の根拠にしない。
  このオントロジーは日本国政府が公開するデータを第三者が構造化したものであり、日本国政府による公式なデータセットではない。
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  jgkglaw: https://jgkg.norr-tech.com/def/law#
  jgkgcore: https://jgkg.norr-tech.com/def/core#
  linkml: https://w3id.org/linkml/
default_prefix: jgkglaw
default_range: string
imports:
  - linkml:types
  - core
  # jurisdiction(range: Organization)がorg.yamlのクラスを要求するため、
  # core だけでなく org も import する(gen-owl/gen-shacl/gen-pydantic は
  # law.yaml を単独でも読むため、推移的importに頼らず明示する)
  - org

slots:
  lawId:
    description: >-
      e-Gov法令APIが付与する法令ID。法令の正準識別子。法令番号(lawNum)や
      題名(lawTitle)は改正で変わり得るため、同一性の根拠にはしない
  lawNum:
    description: >-
      法令番号(例: 「令和七年厚生労働省令第十号」)。年号・法令種別・府省名等を
      含む文字列で、法令番号からの府省導出(経路1)の入力になる
  lawNumType:
    description: >-
      e-Gov法令APIが返す法令種別ラベル(Act/CabinetOrder/MinisterialOrdinance等)。
      実データには例外がある(実測済み)ため、法令種別の判定は lawNum の文字列を正とし、
      このスロットはAPIの生値をそのまま保持する
  lawTitle:
    range: LangString
    description: >-
      法令の題名(現行の正式名称)。題名改正で変わり得るため同一性の根拠にはしない(lawIdを使う)
  abbrev:
    range: LangString
    multivalued: true
    description: 法令の略称。e-Gov法令APIでは0件以上の複数件があり得る
  promulgationDate:
    range: date
    description: 公布日
  repealStatus:
    description: >-
      廃止状態(e-Gov法令APIの repeal_status に対応する分類文字列。現行・廃止等)
  jurisdiction:
    range: Organization
    description: >-
      この法令を所管する府省等。法令番号からの解析(経路1)等で解決できた場合のみ設定する。
      解決できない場合はこのスロットを設定せず、core:UnresolvedReference を別に立てて
      unresolved_reason(OLD_MINISTRY/NO_CANDIDATE/AMBIGUOUS)で理由を分類する
      (このスロット自体は未解決を表さない)
  amendmentLawNum:
    description: この改正を行った法令の番号(改正法令番号)
  amendmentEnforcementDate:
    range: date
    description: この改正版の施行日。CQ8(指定時点における版の取得)の基準になる
  revisionStatus:
    description: この改正版(LawRevision)時点での状態を表す文字列(e-Gov法令API由来)

classes:
  Law:
    is_a: Work
    description: 法令。版(LawRevision)とは独立に、法令IDで同一性を持つ
    slots: [lawId, lawNum, lawNumType, lawTitle, abbrev,
            promulgationDate, repealStatus, jurisdiction]
    slot_usage:
      lawId: { identifier: true }

  LawRevision:
    is_a: Event
    description: 改正イベント。どの法令の・いつ施行の版かを表す(CQ8の器)
    slots: [lawId, amendmentLawNum, amendmentEnforcementDate, revisionStatus]
