id: https://jgkg.norr-tech.com/def/org
name: jgkg-org
title: 日本政府ナレッジグラフ 組織モジュール
description: 組織(府省・法人)を表すクラスとプロパティ。正準IDは法人番号。
  このオントロジーは日本国政府が公開するデータを第三者が構造化したものであり、日本国政府による公式なデータセットではない。
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  jgkgorg: https://jgkg.norr-tech.com/def/org#
  jgkgcore: https://jgkg.norr-tech.com/def/core#
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  schema: http://schema.org/
default_prefix: jgkgorg
default_range: string
imports:
  - linkml:types
  - core

slots:
  houjinBangou:
    description: >-
      国税庁が付与する13桁の法人番号。組織の正準ID。
      required にしないのは、出典管理のためグラフをソース別に分けており、
      1つのエンティティの記述が複数グラフに分かれるため。SHACL検証はグラフ単位
      (グラフが置換の単位)なので、グラフを跨いだ必須制約は原理的に検証できない。
      「全Organizationが法人番号を持つ」ことはCQのSPARQLテストで担保する
    # 数字はASCIIに固定する(裁定B22)。全角数字は`\d`にマッチしても
    # `[0-9]`にはマッチしない — uris.HOUJIN_BANGOU_REと同じ理由
    pattern: "^[0-9]{13}$"
  organizationKindCode:
    description: 法人番号公表サイトの法人種別コード
  ministryCode:
    description: >-
      府省コード。分かる場合にのみ持つ任意の識別子プロパティ(裁定B12)。
      現行の全府省を安定して網羅するコード出典が見つかっておらず、
      Ministryの主キーは名称(skos:prefLabel)である
    required: false
  prefectureName:
    description: 所在地の都道府県名
    range: LangString
  succeededBy:
    range: GovernmentOrgan
    multivalued: true
    required: true
    description: >-
      この廃止された行政機関の事務を承継した現存の行政機関。**多値**
      (1つ以上)——1つの旧機関の異なる部分が異なる承継先を持つ実例がある
      (412CO0000000315「従前の府省等の相当の新府省等を定める政令」の対応表。
      例: 総理府国土庁のうち防災局は内閣府へ、それ以外は国土交通省へ)。
      C-1(ministry_succession)が抽出した対応表からの解決を想定するが、
      このスロット自体は出典を限定しない
  abolitionDate:
    range: date
    required: true
    description: この行政機関が廃止された日付
  cityName:
    description: 所在地の市区町村名
    range: LangString

classes:
  Organization:
    is_a: Agent
    description: 法人番号を持つ組織
    slots: [houjinBangou, organizationKindCode, prefectureName, cityName]
    close_mappings: [schema:Organization]

  GovernmentOrgan:
    is_a: Organization
    description: 法人種別が国の機関である組織

  Ministry:
    is_a: GovernmentOrgan
    # 定義文の変遷(生成物には伝播しないコメントとして記録する。修正ラウンド1・
    # 裁定B36で追記):
    #   裁定B12: 「府省」→「府省及び外局等」に広げた(RS列5∪列6採用による)
    #   裁定B16: 「行政事業レビューの所管府省庁欄・府省庁欄に現れる国の行政機関」
    #     に改めたが、RSに現れない法令経路の3機関(人事院・会計検査院・
    #     国家公安委員会)を字義上除外していた
    #   Task 12: 「法令(府省令・規則)の発令機関としてe-Gov法令API実データに
    #     現れる」を足して3機関を含めたが、「現存する」の限定を落とし、
    #     廃止済み省庁(大蔵省等。実データで名称出現2,271件・34.9%)まで
    #     字義上取り込む逆方向の欠陥を作った(レビューB36)
    #   修正ラウンド1(B36): 「現存する」を戻した。3機関を含める・クラスを
    #     分割しない・URIを変えない、というB16の意図は維持する
    description: >-
      府省及び外局等、行政事業レビューシステム(RS)実データの所管府省庁欄・
      府省庁欄に現れるか、又は法令(府省令・規則)の発令機関としてe-Gov法令API
      実データに現れる、現存する国の行政機関(名称が主キーで、府省コードは
      分かる場合のみ持つ。廃止済みの名称は`old-ministries.csv`により
      OLD_MINISTRYの未解決参照になり、このクラスのインスタンスにはならない)
    # 府省(総務省等)と外局(気象庁等)をサブクラスで区別しない(裁定B16)。
    # 両者を分けて問うCQがPhase 1に無いため(YAGNI)。区別が必要なCQが
    # 立った時点で検討する
    slots: [ministryCode]

  AbolishedGovernmentOrgan:
    is_a: GovernmentOrgan
    # **`Ministry`のサブクラスにしない(C-2裁定)。** `Ministry`は「現存する」
    # 国の行政機関と定義している(裁定B36。上のコメント参照)。廃止済みの
    # 組織を`Ministry`のインスタンスにすると、この定義文がまた逆方向に
    # 破られる(B36が一度実際に踏んだ欠陥と同じ型)。`GovernmentOrgan`の下の
    # 別の子として、`Ministry`と排他に置く
    description: >-
      中央省庁等改革(2001年)等により廃止された、かつて国の行政機関で
      あった組織。旧省庁名の判定集合(`data/reference/old-ministries.csv`)
      に載る名称のうち、法令の対応表(`412CO0000000315`等)から後継が
      解決できたものがこのクラスのインスタンスになる想定(C-1の
      `ministry_succession`参照)。解決できない名称は`OLD_MINISTRY`の
      未解決参照のままで、このクラスのインスタンスにはならない
      (data/reference/old-ministries.csv・transform/old_ministries.py参照)
    slots: [succeededBy, abolitionDate]
