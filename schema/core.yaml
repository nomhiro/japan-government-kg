id: https://jgkg.norr-tech.com/def/core
name: jgkg-core
title: 日本政府ナレッジグラフ コアスキーマ
description: >-
  6軸(誰が/何を/どこで/いつ/いくらで/何について)の基底クラスと、
  出典を表す用語を定義する。ドメイン固有のクラスは各ドメインモジュールで
  このモジュールを import して継承する。
  このオントロジーは日本国政府が公開するデータを第三者が構造化したものであり、日本国政府による公式なデータセットではない。
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  jgkgcore: https://jgkg.norr-tech.com/def/core#
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
default_prefix: jgkgcore
default_range: string
imports:
  - linkml:types

types:
  LangString:
    uri: rdf:langString
    base: str
    description: >-
      言語タグ付きの文字列。人が読む名称や文章に使う。
      識別子やコードには使わない(それらは言語に依存しないため plain な string を使う)。
      この区別をスキーマに明示することで、どの値が言語依存かがモデルから読み取れる。

slots:
  id:
    identifier: true
    description: このリソースのURI
    range: uriorcurie
  label:
    description: 人間が読む名称
    slot_uri: skos:prefLabel
    range: LangString
  occurred_on:
    description: この出来事が起きた日
    range: date
  valid_from:
    description: この記述が真である期間の始まり
    range: date
  valid_until:
    description: この記述が真である期間の終わり
    range: date
  involves_agent:
    description: この出来事に関与した主体
    range: Agent
  amount_jpy:
    title: 金額(円)
    description: 金額(円)
    range: integer
  unresolved_text:
    title: 元の記述
    description: 正準IDに解決できなかった元の参照文字列
    range: LangString
  unresolved_reason:
    title: 特定できなかった理由
    description: 解決できなかった理由
    range: UnresolvedReasonEnum
  unresolved_key:
    title: 元データでの識別子
    description: >-
      解決できなかった参照の、ソース側のキー(府省コード等)。ドメイン固有の
      プロパティを UnresolvedReference に足すと閉じたSHACLシェイプに違反するため、
      汎用のキーとしてここで受ける
  unresolvedFor:
    title: この記述が関わる項目
    description: >-
      この未解決参照が生じた主体(参照元のエンティティ)。CQ9等が未解決ノード
      からその主体へグラフパターンで辿れるようにするための辺(URIの再構成を
      要しない。裁定B8)。方向はUnresolvedReference→主体(逆向きにすると、
      未解決を持ち得る全クラスがこのプロパティを宣言する必要が生じ、閉じた
      シェイプが増殖する。unresolved_keyを汎用スロットとしてUnresolvedReference
      側に置いたのと同じ設計)。**必須にしない** — 主体を特定できない未解決
      (例: emit_ministriesの未解決府省。参照表の1行がどの組織にも対応しない
      だけで、特定の「この記述の主体」が無い)を壊さないため
    range: Entity
  # 以下2つは出典グラフ(graph/provenance)の語彙。どのクラスの slots にも
  # 加えない(UnresolvedReference 等の閉じたシェイプに違反するため)。
  sourceSha256:
    description: >-
      取得した一次資料のバイト列のSHA-256。レイクのスナップショットと一致し、
      KGから入力バイト列まで遡れる(レビューI1)。値はレイクのメタデータから取る
  recordedOn:
    description: >-
      リポジトリに参照表として記録した日。取得日(prov:generatedAtTime)とは
      別の概念(レビューMod①)。「取得」の無いソース(手作りの参照表)はこちらを持つ
    range: date

enums:
  UnresolvedReasonEnum:
    description: 参照が未解決である理由の分類
    enum_uri: jgkgcore:UnresolvedReasonEnum
    permissible_values:
      # 「政府機関の形」の基準(修正ラウンド1・裁定B37): NO_CANDIDATE と
      # OBSOLETE_ORGANIZATION は同じ形の判定(`_looks_like_government_organ`。
      # `transform/law.py`)の肯定/否定なので、両エントリで同じ言葉を使う。
      # 「等」は実装がどこまで拾うかを読者に言い当てさせないため使わない
      # (「人事院」は末尾一致でも拾えるが「閣」は単独字でこの判定にしか乗らない
      # — 実装コメント参照。日本学術会議のような「会議」で終わる語は対象外)
      NO_CANDIDATE:
        # 表示名(裁定B82(4b)): 一般利用者向けの短い言い換え。definitionの
        # 「抽出そのものを疑うべき警報」は実装内部の注意書きなので、表示名には
        # 含めない(仕様§9.2「専門用語を避けた表示名」)
        title: 候補が見つからなかった
        description: >-
          候補が見つからず、政府機関の形(省/府/庁/院/委員会で終わる、又は
          「人事院」「閣」そのもの)にも当たらない。抽出そのものを疑うべき警報
      AMBIGUOUS:
        # definitionそのままで表示名として成立する短さなので言い換えない
        title: 候補が複数あって決められない
        description: 候補が複数あり一意に決められなかった
      OBSOLETE_ORGANIZATION:
        # OLD_MINISTRY(廃止年が分かる)と対で並んだときに区別できることを
        # 優先した——definitionの「現存府省の参照表にも…一致しない」は
        # 二重否定で読みにくいため、肯定形の言い回しに変えた
        title: 府省庁らしい名称だが確認できない
        description: >-
          政府機関の形(省/府/庁/院/委員会で終わる、又は「人事院」「閣」
          そのもの)をしているが、現存府省の参照表にも `old-ministries.csv`
          (OLD_MINISTRY が一致を見る、2001年の中央省庁再編で廃止された名称の
          一覧)にも一致しない —
          **判定はOLD_MINISTRYを先に見て、そこに当たらなかったものの残り**。
          2001年より前に廃止された省庁名や、参照表にまだ収録されていない
          現存機関などが該当し得る(裁定B7。列挙ではなく形から導出するため、
          参照表の完全性次第で現存機関がここに一時的に入り得る)
      OLD_MINISTRY:
        # ブリーフの例そのまま採用(2026-09-05付ブリーフ)。「2001年の中央省庁
        # 再編」は日付を伴う固有の出来事の名前であり、専門用語ではないと判断した
        title: 2001年の再編で廃止された府省名
        description: >-
          参照表に一意に一致すれば resolved、複数一致すれば AMBIGUOUS が
          先に成立する。**いずれでもない場合に限り**
          `old-ministries.csv`(2001年の中央省庁再編で廃止された名称の一覧。
          高信頼・出典あり)との一致を見て、一致すればこの値になる。
          **この一覧に一致しない場合は OBSOLETE_ORGANIZATION 側で判定する**
          (裁定B7でこの enum の意味をこの一覧との一致に狭めた —
          それ以前に廃止された省庁は `OBSOLETE_ORGANIZATION` に分類する)

classes:
  Entity:
    abstract: true
    description: 本KGが扱うすべての事物の基底
    # 6軸(Agent/Work/Place/Event/MonetaryItem/Concept)とUnresolvedReferenceは
    # 互いに素である。7クラスの全組み合わせ21ペア(7C2=21)を、直接の子クラス
    # 全体に対して1つの owl:AllDisjointClasses 公理で表す(R16。以前は
    # schema/overlay/core-axioms.ttl に21本のowl:disjointWithを手書きしていたが、
    # LinkML 1.11.1のgen-owlがこの構文(children_are_mutually_disjoint)を
    # サポートしていることを実機で確認し、単一ソース原則に合わせてこちらへ移した
    # — LinkMLにpairwiseのdisjoint_with生成は実装されていない。実測済み)。
    #
    # Agent と Place の排他は特に意味がある: 「東京都」という行政区域(Place)と、
    # 「東京都」という地方公共団体(Agent、法人番号を持つ)は別のものであり、
    # 別のURIで表す。この公理がその区別を強制する。
    #
    # **この宣言が効くのはEntityの直接の子だけ**(gen-owlの実装: is_a==Entityの
    # クラスだけを集める)。Entityの子はこの7つのみであること
    # (`grep -n "is_a: Entity" schema/*.yaml`)を維持する限り、21ペアという
    # 意味は変わらない
    children_are_mutually_disjoint: true
    slots: [id, label]

  Agent:
    is_a: Entity
    description: 「誰が」の軸。行為の主体。組織と人の上位
    exact_mappings: [prov:Agent]

  Work:
    is_a: Entity
    description: 「何を」の軸。法令・政策・事業・文書・司法判断の上位
    close_mappings: [schema:CreativeWork]

  Place:
    is_a: Entity
    description: 「どこで」の軸。行政区域・住所・地物の上位
    close_mappings: [schema:Place]

  Event:
    is_a: Entity
    description: >-
      「いつ」の軸。時点を持つ出来事。関係を実体化するための中心クラス。
      「AがBに影響した」を直接のエッジにせず、原則としてこのクラスを介す
    slots: [occurred_on, involves_agent]
    close_mappings: [prov:Activity]

  MonetaryItem:
    is_a: Entity
    description: 「いくらで」の軸。予算科目・支出の上位
    slots: [amount_jpy]

  Concept:
    is_a: Entity
    description: 「何について」の軸。主題・指標・制度手続きの上位
    exact_mappings: [skos:Concept]

  UnresolvedReference:
    # 表示名は「未解決参照」にしない。仕様§9.2「専門用語を避けた表示名」——
    # 「未解決」「参照」はいずれもこのプロジェクト固有の解決処理を知らないと
    # 意味が取れないスキーマ内部の語である。このクラスが表すのは「元データに
    # 何らかの記述はあったが、KGの正準IDへ対応付けできなかった」という事実
    # そのものなので、その事実を平易な言葉で言い当てる語を選んだ
    # (裁定B78の作業ブリーフが挙げた代替案を採用)
    title: 対応先が特定できなかった記述
    is_a: Entity
    description: >-
      正準IDに解決できなかった参照。設計書§8.2により、未解決を沈黙させず
      KGに残して計測できるようにするためのクラス
    slots: [unresolved_text, unresolved_reason, unresolved_key, unresolvedFor]
